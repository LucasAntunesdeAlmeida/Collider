name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Ebitengine needs the dev libraries to compile on Linux, and xvfb
      # to provide a virtual display for the tests (GLFW refuses to
      # initialize without one, even headless).
      - name: Install Ebitengine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxxf86vm-dev libasound2-dev pkg-config xvfb

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: xvfb-run --auto-servernum go test ./...

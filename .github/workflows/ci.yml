name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Ebitengine needs the dev libraries to compile on Linux, and xvfb
      # to provide a virtual display for the tests (GLFW refuses to
      # initialize without one, even headless).
      - name: Install Ebitengine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxxf86vm-dev libasound2-dev pkg-config xvfb

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      # Browser builds compile platform files of their own (save_js.go).
      - name: Vet and build for the browser
        run: GOOS=js GOARCH=wasm go vet . && GOOS=js GOARCH=wasm go build ./...

      # So do Windows builds (language_windows.go); Ebitengine needs no
      # cgo there, so they cross-compile from here.
      - name: Vet and build for Windows
        run: GOOS=windows go vet . && GOOS=windows go build ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Test
        run: xvfb-run --auto-servernum go test ./...
